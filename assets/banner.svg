<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="0.6" stop-color="#140B08"/>
      <stop offset="1" stop-color="#1F0E08"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FF4B1F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF4B1F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#FF9068" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FF9068" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFB59E"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4B1F"/>
      <stop offset="1" stop-color="#FF4B1F" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow1)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- decorative code frame -->
    <g transform="translate(930,70)" fill="none" stroke="#FF4B1F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M70 30 L10 90 L70 150"/>
      <path d="M150 30 L210 90 L150 150"/>
      <path d="M125 10 L95 170" stroke="#FFFFFF" stroke-opacity="0.85"/>
    </g>
    <circle cx="1120" cy="48" r="5" fill="#FF4B1F"/>
    <circle cx="1100" cy="48" r="5" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="1080" cy="48" r="5" fill="#FFFFFF" fill-opacity="0.25"/>

    <!-- text -->
    <text x="70" y="96" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="6" fill="#FF4B1F">PORTFOLIO / README</text>
    <text x="70" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="78" font-weight="800" fill="url(#txt)">Muhammad Hassan</text>
    <rect x="72" y="208" width="420" height="4" rx="2" fill="url(#line)"/>
    <text x="70" y="256" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="#E6E6E6">Full Stack Engineer  <tspan fill="#FF4B1F">|</tspan>  AI-Powered Web Apps</text>
    <text x="70" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#8C8C8C">Clean architecture. Smooth UI/UX. High performance.</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#FF4B1F" stroke-opacity="0.35" stroke-width="2"/>
</svg>